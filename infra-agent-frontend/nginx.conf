server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json
               image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # connect-src is 'self' only — SSE uses standard HTTP(S), no WebSocket needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Internal auth verification subrequest ───────────────
    # Called by auth_request before every protected upstream.
    # The BFF returns 200 + identity headers or 401.
    location = /_auth_verify {
        internal;
        proxy_pass ${AUTH_API_UPSTREAM}/auth/verify;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    # Auth API - strips /auth-api prefix before forwarding.
    # NOT behind auth_request (it IS the auth service).
    location /auth-api/ {
        proxy_pass ${AUTH_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Report Agent Template API — routed via Istio gateway (same as Vite dev).
    # /report-api/templates → /clusterid-{id}/report-api/templates → pod :8070 /api/
    location /report-api/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM}/clusterid-${CLUSTER_ID}/report-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    # Main backend API
    location /api/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
    }

    # KYAI API
    location /kyai/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM}/kyai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
    }

    # Onboarding API - rewrites /onboarding-api to /onboarding
    location /onboarding-api/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM}/onboarding/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
    }

    # Digital Twin API - rewrites /digital-twin-api to /onboarding
    location /digital-twin-api/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM}/onboarding/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
    }

    # Sandbox Evaluator API
    location /sandbox-api/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${SANDBOX_EVALUATOR_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
    }

    # Team-specific endpoints (e.g., /team-{uuid}/...).
    # Also serves the SSE flow stream at
    #   GET /team-{uuid}/sse/flows/{cid}/events
    # which requires buffering disabled and long read timeouts so the
    # ops-manager can hold the connection open across HITL approval
    # pauses without being killed by an idle proxy timeout.
    location ~ ^/team-[a-f0-9\-]+ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";

        # SSE-friendly settings: disable response buffering so frames
        # flush to the browser immediately, and stretch read/send
        # timeouts to ~6 hours so an idle, awaiting-approval flow
        # stays connected. The upstream emits a `:keepalive` comment
        # every 15-30s so the connection never falls fully idle.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        # Tell intermediate proxies (e.g. cloud load balancers) to
        # leave the SSE response alone.
        add_header X-Accel-Buffering "no" always;
    }

    # SSE — long-lived text/event-stream for /clusterid-N/sse/*.
    # Must disable proxy_buffering so chunks reach the browser
    # immediately, and disable proxy_cache so EventSource semantics
    # are preserved.  Long read timeout lets a single connection
    # hold for the lifetime of a flow.
    location ~ ^/clusterid-[0-9]+/sse/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # Cluster-specific endpoints with WebSocket support
    location ~ ^/clusterid-[0-9]+ {
        auth_request /_auth_verify;
        auth_request_set $auth_user   $upstream_http_x_forwarded_user;
        auth_request_set $auth_role   $upstream_http_x_forwarded_roles;
        auth_request_set $auth_tenant $upstream_http_x_forwarded_tenant;
        auth_request_set $auth_token  $upstream_http_x_access_token;

        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Roles  $auth_role;
        proxy_set_header X-Forwarded-Tenant $auth_tenant;
        proxy_set_header Authorization "Bearer $auth_token";

        # SSE-friendly settings: disable response buffering so frames
        # flush to the browser immediately, and stretch read/send
        # timeouts to ~6 hours so an idle, awaiting-approval flow
        # stays connected. The upstream emits a `:keepalive` comment
        # every 15-30s so the connection never falls fully idle.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        add_header X-Accel-Buffering "no" always;
    }

    # Uptime Monitor API — rewrites /uptime-api to the uptime-monitor
    # service (default: http://uptime-monitor:8030). Public metrics
    # endpoint, no auth_request needed.
    location /uptime-api/ {
        proxy_pass ${UPTIME_MONITOR_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint — nginx-local, independent of the Next app's
    # own health so an infra-level probe still gets a fast 200 even if the
    # app container is mid-restart (same behavior as the Vite app's nginx).
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else: reverse-proxy to the Next.js server (Phase 18 —
    # this app is server-rendered, not a static SPA, so there's no
    # `try_files ... /index.html` fallback to serve here anymore).
    # `proxy_buffering off` plus the upstream's own `X-Accel-Buffering: no`
    # response header (set in next.config.ts) keep Suspense/loading.tsx
    # streaming responses flushing immediately instead of being buffered.
    location / {
        proxy_pass ${FRONTEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
